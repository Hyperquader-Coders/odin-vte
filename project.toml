# What odin-vte is and needs: build is what a program on it needs, test what only its own tests
# and checks need. house-rules docs/PROJECT_TOML.md has the layout.
[project]
schema = "amber-project-1"
name = "odin-vte"
license = "LGPL-3.0-or-later"
kind = "binding"
summary = "Odin bindings for VTE, generated with runic"
tags = [
  "ai-assisted",
  "bindings",
  "linux",
  "odin",
  "runic",
  "vte",
]
collection = "vte"

[siblings.AMBER_ROOT]
odin-glib = "https://github.com/Hyperquader-Coders/odin-glib"
odin-cairo = "https://github.com/Hyperquader-Coders/odin-cairo"
odin-pango = "https://github.com/Hyperquader-Coders/odin-pango"
odin-graphene = "https://github.com/Hyperquader-Coders/odin-graphene"
odin-gdk-pixbuf = "https://github.com/Hyperquader-Coders/odin-gdk-pixbuf"
odin-gtk4 = "https://github.com/Hyperquader-Coders/odin-gtk4"

[build]
# The suite's VTE and GTK bundles, which the binding is generated from and tested against.
packages = [
  "amber-vte-dev",
  "amber-gtk4-dev",
]
lib = [
  "vte",
]

[test]
packages = [
  "shellcheck",
  "shfmt",
]
